ktor:
  application:
    modules:
      - pl.dev.bkwiatkowski.ApplicationKt.module
  deployment:
    host: "0.0.0.0"
    port: 8080
jwt:
  domain: ${JWT_ISSUER}
  audience: "jwt-audience"
  realm: "orienteeringApp"
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER}
postgres:
  host: ${DB_HOST}
  port: "5432"
  database: ${POSTGRES_DB}
  user: ${POSTGRES_USER}
  password: ${POSTGRES_PASSWORD}
