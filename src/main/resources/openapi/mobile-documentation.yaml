openapi: "3.0.3"
info:
  title: "OrienteeringApp Mobile API"
  version: "0.0.1"
  description: "API documentation for OrienteeringApp Mobile Client"
servers:
  - url: http://localhost:8080
    description: "Local development server"
paths:
  /api/mobile/auth/register:
    post:
      operationId: "registerMobileUser"
      summary: "Mobile User Registration"
      description: "Registers a new mobile user account with username, email, and optional mobile-specific fields"
      tags:
        - "Mobile Authentication"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileSignUpRequestDto"
      responses:
        "201":
          description: "User registered successfully and returns authentication tokens"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileSignInResponseDto"
        "400":
          description: "Bad Request - Invalid or missing request body"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Conflict - Validation failed or user already exists"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/mobile/auth/login:
    post:
      operationId: "loginMobileUser"
      summary: "Mobile User Login"
      description: "Authenticates a mobile user and returns access token, refresh token, and token expiration time"
      tags:
        - "Mobile Authentication"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileSignInRequestDto"
      responses:
        "200":
          description: "Login successful"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileSignInResponseDto"
        "400":
          description: "Bad Request - Invalid or missing request body"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Not Found - User does not exist"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Unauthorized - Invalid credentials"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/mobile/auth/refresh:
    post:
      operationId: "refreshMobileToken"
      summary: "Refresh Access Token"
      description: "Refreshes the user's access token using a valid refresh token. Returns new access token and refresh token."
      tags:
        - "Mobile Authentication"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileRefreshTokenRequestDto"
      responses:
        "200":
          description: "Token refreshed successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileSignInResponseDto"
        "400":
          description: "Bad Request - Invalid or missing request body"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Unauthorized - Invalid, expired, or reused refresh token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/mobile/settings:
    get:
      operationId: "getMobileSettings"
      summary: "Get Mobile Settings"
      description: "Returns mobile client settings including current server time. Used for synchronizing client clock and retrieving configuration."
      tags:
        - "Mobile Settings"
      security:
        - bearerAuth: [ ]
      responses:
        "200":
          description: "Mobile settings retrieved successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileSettingsResponseDto"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/mobile/events:
    get:
      operationId: "getMobileEvents"
      summary: "Get All Events (Mobile)"
      description: "Retrieves a list of events for mobile users. Mobile users see events according to mobile authorization rules. Returns an empty list if none."
      security:
        - bearerAuth: [ ]
      tags:
        - "Mobile Events"
      responses:
        "200":
          description: "Successful operation"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MobileEventListResponseDto"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/mobile/events/{id}:
    get:
      operationId: "getMobileEventById"
      summary: "Get Event Details (Mobile)"
      description: "Retrieves detailed information about a specific event for mobile users. **Requires authentication.**"
      security:
        - bearerAuth: [ ]
      tags:
        - "Mobile Events"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: "Event ID"
      responses:
        "200":
          description: "Successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileEventDetailResponseDto"
        "400":
          description: "Bad Request - Invalid event ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Not Found - Event does not exist"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    ErrorResponse:
      type: object
      description: "Standard error response"
      required:
        - businessCode
        - message
      properties:
        businessCode:
          type: string
          description: "Business error code"
          example: "VALIDATION_FAILED"
        message:
          type: string
          description: "Human-readable error message"
          example: "User with this email already exists"
    MobileSignUpRequestDto:
      type: object
      description: "Mobile user registration request"
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          description: "Unique username for the mobile user"
          example: "john_doe"
          minLength: 3
          maxLength: 50
        email:
          type: string
          format: email
          description: "Email address for the mobile user"
          example: "john@example.com"
        password:
          type: string
          format: password
          description: "Password for the account"
          example: "SecurePassword123!"
          minLength: 8
        phoneNumber:
          type: string
          nullable: true
          description: "Optional phone number (mobile-specific)"
          example: "+48123456789"
        dateOfBirth:
          type: string
          format: date-time
          nullable: true
          description: "Optional date of birth in ISO 8601 format (mobile-specific)"
          example: "1990-05-15T10:30:00"
    MobileSignInRequestDto:
      type: object
      description: "Mobile user login request"
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: "Username or email of the mobile user"
          example: "john_doe"
        password:
          type: string
          format: password
          description: "User password"
          example: "SecurePassword123!"
    MobileRefreshTokenRequestDto:
      type: object
      description: "Token refresh request"
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          description: "Valid refresh token obtained from login or previous refresh"
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
    MobileSignInResponseDto:
      type: object
      description: "Mobile user authentication response with tokens"
      required:
        - accessToken
        - refreshToken
        - accessTokenExpiresTimestamp
        - refreshTokenExpiresTimestamp
      properties:
        accessToken:
          type: string
          description: "JWT access token for API requests. Include in Authorization header as 'Bearer {token}'"
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refreshToken:
          type: string
          description: "JWT refresh token for obtaining new access tokens. Store securely in mobile device."
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        accessTokenExpiresTimestamp:
          type: integer
          format: int64
          description: "Expiration timestamp (epoch seconds) for access token"
          example: 1710000000
        refreshTokenExpiresTimestamp:
          type: integer
          format: int64
          description: "Expiration timestamp (epoch seconds) for refresh token"
          example: 1710086400
    MobileSettingsResponseDto:
      type: object
      description: "Mobile client settings response"
      required:
        - serverLocalDateTime
      properties:
        serverLocalDateTime:
          type: string
          format: date-time
          description: "Server local time as LocalDateTime in ISO-8601 (no offset). Serialized as java.time.LocalDateTime."
          example: "2026-06-25T12:34:56"
    MobileMapDto:
      type: object
      required:
        - id
        - name
        - description
        - imageData
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        imageData:
          type: string
          description: "Base64 encoded image data"
    MobileEventListResponseDto:
      type: object
      required:
        - id
        - map
        - name
        - description
        - createdAt
        - startDate
        - startLocationX
        - startLocationY
        - createdByUsername
        - eventType
      properties:
        id:
          type: integer
        map:
          $ref: "#/components/schemas/MobileMapDto"
        name:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
          description: "ISO 8601 format date-time"
        startDate:
          type: string
          format: date-time
          description: "ISO 8601 format date-time"
        startLocationX:
          type: number
          format: float
        startLocationY:
          type: number
          format: float
        createdByUsername:
          type: string
          description: "Username of the user who created the event"
        eventType:
          type: string
          enum: [ ONLINE, OFFLINE ]
          description: "Event type - ONLINE (normal) or OFFLINE (continuous)"
    MobileEventDetailResponseDto:
      type: object
      required:
        - id
        - map
        - name
        - description
        - createdAt
        - startDate
        - startLocationX
        - startLocationY
        - status
        - eventType
      properties:
        id:
          type: integer
        map:
          $ref: "#/components/schemas/MobileMapDto"
        name:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
          description: "ISO 8601 format date-time"
        startDate:
          type: string
          format: date-time
          description: "ISO 8601 format date-time"
        startLocationX:
          type: number
          format: float
        startLocationY:
          type: number
          format: float
        status:
          type: string
          enum: [ PLANNED, IN_PROGRESS, COMPLETED, CONTINUOUS ]
          description: "Event status (PLANNED, IN_PROGRESS, COMPLETED, CONTINUOUS)"
        finishedAt:
          type: string
          format: date-time
          description: "ISO 8601 format date-time when event finished (nullable)"
        allowOfflineTracking:
          type: boolean
          description: "Allow users to track the event offline even after it ends"
        eventType:
          type: string
          enum: [ ONLINE, OFFLINE ]
          description: "Event type - ONLINE (normal) or OFFLINE (continuous)"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT