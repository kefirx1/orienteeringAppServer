openapi: "3.0.3"
info:
  title: "OrienteeringApp Mobile API"
  version: "0.0.1"
  description: "API documentation for OrienteeringApp Mobile Client"
servers:
  - url: http://localhost:8080
    description: "Local development server"
paths:
  /api/mobile/auth/register:
    post:
      operationId: "registerMobileUser"
      summary: "Mobile User Registration"
      description: "Registers a new mobile user account with username, email, and optional mobile-specific fields"
      tags:
        - "Mobile Authentication"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileSignUpRequestDto"
      responses:
        "201":
          description: "User registered successfully and returns authentication tokens"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileSignInResponseDto"
        "400":
          description: "Bad Request - Invalid or missing request body"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Conflict - Validation failed or user already exists"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/mobile/auth/login:
    post:
      operationId: "loginMobileUser"
      summary: "Mobile User Login"
      description: "Authenticates a mobile user and returns access token, refresh token, and token expiration time"
      tags:
        - "Mobile Authentication"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileSignInRequestDto"
      responses:
        "200":
          description: "Login successful"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileSignInResponseDto"
        "400":
          description: "Bad Request - Invalid or missing request body"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Not Found - User does not exist"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Unauthorized - Invalid credentials"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/mobile/auth/refresh:
    post:
      operationId: "refreshMobileToken"
      summary: "Refresh Access Token"
      description: "Refreshes the user's access token using a valid refresh token. Returns new access token and refresh token."
      tags:
        - "Mobile Authentication"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileRefreshTokenRequestDto"
      responses:
        "200":
          description: "Token refreshed successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileSignInResponseDto"
        "400":
          description: "Bad Request - Invalid or missing request body"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Unauthorized - Invalid, expired, or reused refresh token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/mobile/settings:
    get:
      operationId: "getMobileSettings"
      summary: "Get Mobile Settings"
      description: "Returns mobile client settings including current server time. Used for synchronizing client clock and retrieving configuration."
      tags:
        - "Mobile Settings"
      responses:
        "200":
          description: "Mobile settings retrieved successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileSettingsResponseDto"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    ErrorResponse:
      type: object
      description: "Standard error response"
      required:
        - businessCode
        - message
      properties:
        businessCode:
          type: string
          description: "Business error code"
          example: "VALIDATION_FAILED"
        message:
          type: string
          description: "Human-readable error message"
          example: "User with this email already exists"
    MobileSignUpRequestDto:
      type: object
      description: "Mobile user registration request"
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          description: "Unique username for the mobile user"
          example: "john_doe"
          minLength: 3
          maxLength: 50
        email:
          type: string
          format: email
          description: "Email address for the mobile user"
          example: "john@example.com"
        password:
          type: string
          format: password
          description: "Password for the account"
          example: "SecurePassword123!"
          minLength: 8
        phoneNumber:
          type: string
          nullable: true
          description: "Optional phone number (mobile-specific)"
          example: "+48123456789"
        dateOfBirth:
          type: string
          format: date-time
          nullable: true
          description: "Optional date of birth in ISO 8601 format (mobile-specific)"
          example: "1990-05-15T10:30:00"
    MobileSignInRequestDto:
      type: object
      description: "Mobile user login request"
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: "Username or email of the mobile user"
          example: "john_doe"
        password:
          type: string
          format: password
          description: "User password"
          example: "SecurePassword123!"
    MobileRefreshTokenRequestDto:
      type: object
      description: "Token refresh request"
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          description: "Valid refresh token obtained from login or previous refresh"
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
    MobileSignInResponseDto:
      type: object
      description: "Mobile user authentication response with tokens"
      required:
        - accessToken
        - refreshToken
        - accessTokenExpiresTimestamp
        - refreshTokenExpiresTimestamp
      properties:
        accessToken:
          type: string
          description: "JWT access token for API requests. Include in Authorization header as 'Bearer {token}'"
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refreshToken:
          type: string
          description: "JWT refresh token for obtaining new access tokens. Store securely in mobile device."
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        accessTokenExpiresTimestamp:
          type: integer
          format: int64
          description: "Expiration timestamp (epoch seconds) for access token"
          example: 1710000000
        refreshTokenExpiresTimestamp:
          type: integer
          format: int64
          description: "Expiration timestamp (epoch seconds) for refresh token"
          example: 1710086400
    MobileSettingsResponseDto:
      type: object
      description: "Mobile client settings response"
      required:
        - serverLocalDateTime
      properties:
        serverLocalDateTime:
          type: string
          format: date-time
          description: "Server local time as LocalDateTime in ISO-8601 (no offset). Serialized as java.time.LocalDateTime."
          example: "2026-06-25T12:34:56"