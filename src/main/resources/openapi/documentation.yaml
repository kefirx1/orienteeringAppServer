openapi: "3.0.3"
info:
  title: "OrienteeringAppServer API"
  version: "0.0.1"
  description: "API documentation for OrienteeringAppServer"
servers:
  - url: http://localhost:8080
    description: "Local development server"
paths:
  /api/auth/signup:
    post:
      summary: "User Sign Up"
      description: "Registers a new user"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpRequestDto"
      responses:
        "200":
          description: "Successful operation"
        "400":
          description: "Bad Request - Invalid payload"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Conflict - Invalid data or user already exists"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/signin:
    post:
      summary: "User Sign In"
      description: "Authenticates a user and returns a token"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequestDto"
      responses:
        "200":
          description: "Successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInResponseDto"
          headers:
            Set-Cookie:
              schema:
                type: string
              description: "HttpOnly refresh token cookie"
        "400":
          description: "Bad Request - Invalid payload"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Unauthorized - Invalid credentials"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Not Found - User does not exist"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/refresh:
    post:
      summary: "Refresh Token"
      description: "Refreshes user authentication using a refresh token from an HttpOnly cookie"
      responses:
        "200":
          description: "Successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInResponseDto"
          headers:
            Set-Cookie:
              schema:
                type: string
              description: "New HttpOnly refresh token cookie"
        "400":
          description: "Bad Request - Missing refresh token cookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Unauthorized - Invalid or expired refresh token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/logout:
    post:
      summary: "User Logout"
      description: "Logs out the user by revoking all their refresh tokens"
      security:
        - bearerAuth: [ ]
      responses:
        "200":
          description: "Successful operation"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/change-password:
    post:
      summary: "Change User Password"
      description: "Changes the password of the authenticated user. The user must provide their old password for verification."
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequestDto"
      responses:
        "200":
          description: "Password changed successfully"
        "400":
          description: "Bad Request - Invalid payload or empty passwords"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Unauthorized - Not authenticated"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Forbidden - Invalid old password or user not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/authenticate:
    get:
      summary: "Authenticate User"
      description: "Checks if the current user is authenticated"
      security:
        - bearerAuth: [ ]
      responses:
        "200":
          description: "Successful operation"
        "401":
          description: "Unauthorized"
  /api/settings:
    get:
      summary: "Get Settings"
      description: "Returns basic settings for the authenticated user"
      security:
        - bearerAuth: [ ]
      responses:
        "200":
          description: "User settings"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResponseDto"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Not Found - User does not exist"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/maps:
    get:
      summary: "Get All Maps"
      description: "Retrieves a list of all available maps with basic information"
      security:
        - bearerAuth: [ ]
      responses:
        "200":
          description: "Successful operation"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MapListResponseDto"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: "Create New Map"
      description: "Creates a new orienteering map with waypoints and base64 encoded image data"
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMapRequestDto"
      responses:
        "201":
          description: "Map created successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateMapResponseDto"
        "400":
          description: "Bad Request - Invalid payload"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Forbidden - Only admins can add maps"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/maps/{id}:
    get:
      summary: "Get Map Details"
      description: "Retrieves complete information about a specific map including all waypoints"
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: "Map ID"
      responses:
        "200":
          description: "Successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapDetailResponseDto"
        "400":
          description: "Bad Request - Invalid map ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Not Found - Map does not exist"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: "Delete Map"
      description: "Deletes a map and all its associated waypoints"
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: "Map ID"
      responses:
        "200":
          description: "Map deleted successfully"
        "400":
          description: "Bad Request - Invalid map ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Forbidden - Only admins can delete maps"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Not Found - Map does not exist"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/events:
    get:
      summary: "Get All Events"
      description: "Retrieves a list of events. Regular users see only their own events, admins see all events. Returns an empty list if the user has no events"
      security:
        - bearerAuth: [ ]
      responses:
        "200":
          description: "Successful operation"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventListResponseDto"
    post:
      summary: "Create New Event"
      description: "Creates a new event assigned to the authenticated user"
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddEventRequestDto"
      responses:
        "201":
          description: "Event created successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateEventResponseDto"
        "400":
          description: "Bad Request - Invalid payload"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/events/{id}:
    get:
      summary: "Get Event Details"
      description: "Retrieves detailed information about a specific event. Access is restricted to event owner or admin users. **Requires authentication.**"
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: "Event ID"
      responses:
        "200":
          description: "Successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetailResponseDto"
        "400":
          description: "Bad Request - Invalid event ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Forbidden - Not authenticated or no permission to view this event"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Not Found - Event does not exist"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: "Delete Event"
      description: "Deletes an event. Users can only delete their own events, admins can delete any event"
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: "Event ID"
      responses:
        "200":
          description: "Event deleted successfully"
        "400":
          description: "Bad Request - Invalid event ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Not Found - Event does not exist"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/events/{eventId}/participants-progression:
    get:
      summary: "Get Event Participants Progression"
      description: "Retrieves a list of all participants' progression data for a specific event, sorted by waypoints visited (descending), then by time spent (ascending), then by participation order. Access is restricted to event owner or admin users. **Requires authentication.**"
      security:
        - bearerAuth: [ ]
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
          description: "Event ID"
      responses:
        "200":
          description: "Successful operation"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventParticipantProgressionDto"
        "400":
          description: "Bad Request - Invalid event ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Forbidden - Not authenticated or no permission to view this event's participants"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Not Found - Event does not exist"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/events/{id}/session:
    post:
      summary: "Create Event Session"
      description: "Opens a new session for the specified event. Accessible by event owner or admin. **Requires authentication.**"
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: "Event ID"
      responses:
        "201":
          description: "Session created successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateEventSessionResponseDto"
        "400":
          description: "Bad Request - Invalid event ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Forbidden - Not authenticated or no permission to open session"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Not Found - Event does not exist"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/events/{id}/session/joinable:
    post:
      summary: "Set session joinable"
      description: "Sets whether users can join the session for the specified event. Accessible by event owner or admin. **Requires authentication.**"
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: "Event ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetEventSessionJoinableRequestDto"
      responses:
        "200":
          description: "Session updated successfully"
        "400":
          description: "Bad Request - Invalid event ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Forbidden - Not authenticated or no permission to update session"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Not Found - Event or session does not exist"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/events/{id}/session/close:
    post:
      summary: "Close session"
      description: "Closes the session for the specified event (sets finishedAt and disables joining). Accessible by event owner or admin. **Requires authentication.**"
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: "Event ID"
      responses:
        "200":
          description: "Session closed successfully"
        "400":
          description: "Bad Request - Invalid event ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Forbidden - Not authenticated or no permission to close session"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Not Found - Event or session does not exist"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/events/{id}/session/{sessionUuid}/user/{userId}/waypoints:
    get:
      summary: "Get session waypoint details for a mobile user"
      description: "Retrieves a list of waypoint visit details (visitedAt, label, image path) for a given session UUID and mobile user. Accessible by event owner or admin. **Requires authentication.**"
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: "Event ID"
        - name: sessionUuid
          in: path
          required: true
          schema:
            type: string
          description: "UUID of the event session"
        - name: userId
          in: path
          required: true
          schema:
            type: integer
          description: "Mobile user ID"
        - name: participantId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: "List of session waypoint details returned"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionWaypointDetailsWebResponseDto"
        "400":
          description: "Bad Request - invalid parameters"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Unauthorized - missing or invalid token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Forbidden - Not authenticated or no permission to view this event's session waypoint details"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Not Found - Event, session or user does not exist"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/events/images:
    get:
      summary: "Get event image file (query param)"
      description: "Alternative endpoint that accepts the relative image path as a query parameter `path`. Useful for clients that percent-encode slashes in path variables. Example: /api/events/images?path={sessionUuid}/photo.jpg. Requires authentication."
      security:
        - bearerAuth: [ ]
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
          description: "Relative path under images storage, e.g. '{sessionUuid}/photo.jpg'"
      responses:
        "200":
          description: "JPEG image binary"
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "401":
          description: "Unauthorized - missing or invalid token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Forbidden - user does not have access to this image"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Not Found - image or session does not exist"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: "Unsupported Media Type - only JPG/JPEG images are supported"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/users:
    get:
      summary: "Get All Admin Panel Users"
      description: "Returns a list of all admin panel users. **Requires ADMIN role.**"
      security:
        - bearerAuth: [ ]
      responses:
        "200":
          description: "Successful operation"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUserResponseDto"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Forbidden - Only admins can access this resource"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: "Add Admin Panel User"
      description: "Creates a new admin panel user. **Requires ADMIN role.**"
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddAdminUserRequestDto"
      responses:
        "201":
          description: "User created successfully"
        "400":
          description: "Bad Request - Invalid payload"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Forbidden - Only admins can access this resource"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Conflict - Validation failed or user already exists"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/users/{id}:
    delete:
      summary: "Delete Admin Panel User"
      description: "Deletes an admin panel user by ID. **Requires ADMIN role.** An admin cannot delete their own account."
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: "User ID"
      responses:
        "200":
          description: "User deleted successfully"
        "400":
          description: "Bad Request - Invalid user ID or attempting to delete own account"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Forbidden - Only admins can access this resource"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Not Found - User does not exist"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        businessCode:
          type: string
        message:
          type: string
    SignUpRequestDto:
      type: object
      required:
        - username
        - password
