openapi: "3.0.3"
info:
  title: "OrienteeringAppServer API"
  version: "0.0.1"
  description: "API documentation for OrienteeringAppServer"
servers:
  - url: http://localhost:8080
    description: "Local development server"
paths:
  /api/auth/signup:
    post:
      summary: "User Sign Up"
      description: "Registers a new user"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpRequestDto"
      responses:
        "200":
          description: "Successful operation"
        "400":
          description: "Bad Request - Invalid payload"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Conflict - Invalid data or user already exists"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/signin:
    post:
      summary: "User Sign In"
      description: "Authenticates a user and returns a token"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequestDto"
      responses:
        "200":
          description: "Successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInResponseDto"
          headers:
            Set-Cookie:
              schema:
                type: string
              description: "HttpOnly refresh token cookie"
        "400":
          description: "Bad Request - Invalid payload"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Unauthorized - Invalid credentials"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Not Found - User does not exist"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/refresh:
    post:
      summary: "Refresh Token"
      description: "Refreshes user authentication using a refresh token from an HttpOnly cookie"
      responses:
        "200":
          description: "Successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInResponseDto"
          headers:
            Set-Cookie:
              schema:
                type: string
              description: "New HttpOnly refresh token cookie"
        "400":
          description: "Bad Request - Missing refresh token cookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Unauthorized - Invalid or expired refresh token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/logout:
    post:
      summary: "User Logout"
      description: "Logs out the user by revoking all their refresh tokens"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "Successful operation"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/authenticate:
    get:
      summary: "Authenticate User"
      description: "Checks if the current user is authenticated"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "Successful operation"
        "401":
          description: "Unauthorized"
components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        businessCode:
          type: string
        message:
          type: string
    SignUpRequestDto:
      type: object
      required:
        - username
        - password
        - email
      properties:
        username:
          type: string
        password:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [USER, ADMIN]
          default: USER
    SignInRequestDto:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
    SignInResponseDto:
      type: object
      required:
        - token
        - expiresInSec
        - role
      properties:
        token:
          type: string
        expiresInSec:
          type: integer
          format: int64
        role:
          type: string
          enum: [USER, ADMIN]
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
