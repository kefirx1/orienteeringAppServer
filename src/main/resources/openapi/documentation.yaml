openapi: "3.0.3"
info:
  title: "OrienteeringAppServer API"
  version: "0.0.1"
  description: "API documentation for OrienteeringAppServer"
servers:
  - url: http://localhost:8080
    description: "Local development server"
paths:
  /api/auth/signup:
    post:
      summary: "User Sign Up"
      description: "Registers a new user"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpRequestDto"
      responses:
        "200":
          description: "Successful operation"
        "400":
          description: "Bad Request - Invalid payload"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Conflict - Invalid data or user already exists"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/signin:
    post:
      summary: "User Sign In"
      description: "Authenticates a user and returns a token"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequestDto"
      responses:
        "200":
          description: "Successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInResponseDto"
          headers:
            Set-Cookie:
              schema:
                type: string
              description: "HttpOnly refresh token cookie"
        "400":
          description: "Bad Request - Invalid payload"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Unauthorized - Invalid credentials"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Not Found - User does not exist"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/refresh:
    post:
      summary: "Refresh Token"
      description: "Refreshes user authentication using a refresh token from an HttpOnly cookie"
      responses:
        "200":
          description: "Successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInResponseDto"
          headers:
            Set-Cookie:
              schema:
                type: string
              description: "New HttpOnly refresh token cookie"
        "400":
          description: "Bad Request - Missing refresh token cookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Unauthorized - Invalid or expired refresh token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/logout:
    post:
      summary: "User Logout"
      description: "Logs out the user by revoking all their refresh tokens"
      security:
        - bearerAuth: [ ]
      responses:
        "200":
          description: "Successful operation"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/change-password:
    post:
      summary: "Change User Password"
      description: "Changes the password of the authenticated user. The user must provide their old password for verification."
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequestDto"
      responses:
        "200":
          description: "Password changed successfully"
        "400":
          description: "Bad Request - Invalid payload or empty passwords"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Unauthorized - Not authenticated"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Forbidden - Invalid old password or user not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/authenticate:
    get:
      summary: "Authenticate User"
      description: "Checks if the current user is authenticated"
      security:
        - bearerAuth: [ ]
      responses:
        "200":
          description: "Successful operation"
        "401":
          description: "Unauthorized"
  /api/settings:
    get:
      summary: "Get Settings"
      description: "Returns basic settings for the authenticated user"
      security:
        - bearerAuth: [ ]
      responses:
        "200":
          description: "User settings"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResponseDto"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Not Found - User does not exist"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/maps:
    get:
      summary: "Get All Maps"
      description: "Retrieves a list of all available maps with basic information"
      security:
        - bearerAuth: [ ]
      responses:
        "200":
          description: "Successful operation"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MapListResponseDto"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: "Create New Map"
      description: "Creates a new orienteering map with waypoints and base64 encoded image data"
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMapRequestDto"
      responses:
        "201":
          description: "Map created successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateMapResponseDto"
        "400":
          description: "Bad Request - Invalid payload"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Forbidden - Only admins can add maps"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/maps/{id}:
    get:
      summary: "Get Map Details"
      description: "Retrieves complete information about a specific map including all waypoints"
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: "Map ID"
      responses:
        "200":
          description: "Successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapDetailResponseDto"
        "400":
          description: "Bad Request - Invalid map ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Not Found - Map does not exist"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: "Delete Map"
      description: "Deletes a map and all its associated waypoints"
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: "Map ID"
      responses:
        "200":
          description: "Map deleted successfully"
        "400":
          description: "Bad Request - Invalid map ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Forbidden - Only admins can delete maps"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Not Found - Map does not exist"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/events:
    get:
      summary: "Get All Events"
      description: "Retrieves a list of events. Regular users see only their own events, admins see all events. Returns an empty list if the user has no events"
      security:
        - bearerAuth: [ ]
      responses:
        "200":
          description: "Successful operation"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventListResponseDto"
    post:
      summary: "Create New Event"
      description: "Creates a new event assigned to the authenticated user"
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddEventRequestDto"
      responses:
        "201":
          description: "Event created successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateEventResponseDto"
        "400":
          description: "Bad Request - Invalid payload"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/events/{id}:
    get:
      summary: "Get Event Details"
      description: "Retrieves detailed information about a specific event"
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: "Event ID"
      responses:
        "200":
          description: "Successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetailResponseDto"
        "400":
          description: "Bad Request - Invalid event ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Not Found - Event does not exist"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: "Delete Event"
      description: "Deletes an event. Users can only delete their own events, admins can delete any event"
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: "Event ID"
      responses:
        "200":
          description: "Event deleted successfully"
        "400":
          description: "Bad Request - Invalid event ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Not Found - Event does not exist"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/users:
    get:
      summary: "Get All Admin Panel Users"
      description: "Returns a list of all admin panel users. **Requires ADMIN role.**"
      security:
        - bearerAuth: [ ]
      responses:
        "200":
          description: "Successful operation"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUserResponseDto"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Forbidden - Only admins can access this resource"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: "Add Admin Panel User"
      description: "Creates a new admin panel user. **Requires ADMIN role.**"
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddAdminUserRequestDto"
      responses:
        "201":
          description: "User created successfully"
        "400":
          description: "Bad Request - Invalid payload"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Forbidden - Only admins can access this resource"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Conflict - Validation failed or user already exists"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/admin/users/{id}:
    delete:
      summary: "Delete Admin Panel User"
      description: "Deletes an admin panel user by ID. **Requires ADMIN role.** An admin cannot delete their own account."
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: "User ID"
      responses:
        "200":
          description: "User deleted successfully"
        "400":
          description: "Bad Request - Invalid user ID or attempting to delete own account"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Forbidden - Only admins can access this resource"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Not Found - User does not exist"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        businessCode:
          type: string
        message:
          type: string
    SignUpRequestDto:
      type: object
      required:
        - username
        - password
        - email
      properties:
        username:
          type: string
        password:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [ USER, ADMIN ]
          default: USER
    ChangePasswordRequestDto:
      type: object
      required:
        - oldPassword
        - newPassword
      properties:
        oldPassword:
          type: string
          description: "The current password for verification"
        newPassword:
          type: string
          description: "The new password for the user"
    SignInRequestDto:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
    SignInResponseDto:
      type: object
      required:
        - token
        - expiresInSec
        - role
      properties:
        token:
          type: string
        expiresInSec:
          type: integer
          format: int64
        role:
          type: string
          enum: [ USER, ADMIN ]
    SettingsResponseDto:
      type: object
      required:
        - username
      properties:
        username:
          type: string
    MapListResponseDto:
      type: object
      required:
        - id
        - name
        - description
        - imageData
        - canPlayManually
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        imageData:
          type: string
          description: "Base64 encoded image data"
        canPlayManually:
          type: boolean
          description: "Whether the map can be played manually"
    MapDetailResponseDto:
      type: object
      required:
        - id
        - name
        - description
        - imageData
        - canPlayManually
        - waypoints
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        imageData:
          type: string
          description: "Base64 encoded image data"
        canPlayManually:
          type: boolean
          description: "Whether the map can be played manually"
        waypoints:
          type: array
          items:
            $ref: "#/components/schemas/WaypointResponseDto"
    WaypointResponseDto:
      type: object
      required:
        - id
        - label
        - coordinateX
        - coordinateY
      properties:
        id:
          type: integer
        label:
          type: string
        coordinateX:
          type: number
          format: float
        coordinateY:
          type: number
          format: float
    AddMapRequestDto:
      type: object
      required:
        - name
        - description
        - imageData
        - canPlayManually
      properties:
        name:
          type: string
        description:
          type: string
        imageData:
          type: string
          description: "Base64 encoded image data (required)"
        canPlayManually:
          type: boolean
          description: "Whether the map can be played manually"
        waypoints:
          type: array
          items:
            $ref: "#/components/schemas/WaypointRequestDto"
    WaypointRequestDto:
      type: object
      required:
        - label
        - coordinateX
        - coordinateY
      properties:
        label:
          type: string
        coordinateX:
          type: number
          format: float
        coordinateY:
          type: number
          format: float
    CreateMapResponseDto:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
    AddEventRequestDto:
      type: object
      required:
        - mapId
        - name
        - description
        - startDateTime
        - startLocationX
        - startLocationY
      properties:
        mapId:
          type: integer
          description: "ID of the map associated with this event"
        name:
          type: string
        description:
          type: string
        startDateTime:
          type: string
          format: date-time
          description: "ISO 8601 format date-time"
        startLocationX:
          type: number
          format: float
          description: "X coordinate of the event start location"
        startLocationY:
          type: number
          format: float
          description: "Y coordinate of the event start location"
    EventListResponseDto:
      type: object
      required:
        - id
        - map
        - name
        - description
        - createdAt
        - startDate
        - startLocationX
        - startLocationY
        - createdByUsername
      properties:
        id:
          type: integer
        map:
          $ref: "#/components/schemas/MapDto"
        name:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
          description: "ISO 8601 format date-time"
        startDate:
          type: string
          format: date-time
          description: "ISO 8601 format date-time"
        startLocationX:
          type: number
          format: float
        startLocationY:
          type: number
          format: float
        createdByUsername:
          type: string
          description: "Username of the user who created the event"
    EventDetailResponseDto:
      type: object
      required:
        - id
        - map
        - name
        - description
        - createdAt
        - startDate
        - startLocationX
        - startLocationY
      properties:
        id:
          type: integer
        map:
          $ref: "#/components/schemas/MapDto"
        name:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
          description: "ISO 8601 format date-time"
        startDate:
          type: string
          format: date-time
          description: "ISO 8601 format date-time"
        startLocationX:
          type: number
          format: float
        startLocationY:
          type: number
          format: float
    MapDto:
      type: object
      required:
        - id
        - name
        - description
        - imageData
        - canPlayManually
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        imageData:
          type: string
          description: "Base64 encoded image data"
        canPlayManually:
          type: boolean
    CreateEventResponseDto:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
    AddAdminUserRequestDto:
      type: object
      required:
        - username
        - password
        - email
      properties:
        username:
          type: string
        password:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [ USER, ADMIN ]
          default: USER
    AdminUserResponseDto:
      type: object
      required:
        - id
        - username
        - email
        - role
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [ USER, ADMIN ]
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT